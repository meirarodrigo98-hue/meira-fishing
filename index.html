<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Meira Fishing</title>
<script src="js/boot-cache.js"></script>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="map"></div>
<div class="map-dim" id="mapDim" aria-hidden="true"></div>

<header class="topbar">
  <p class="status" id="statusLine">Mapa do RJ</p>
  <button class="btn-icon" id="relocate" type="button" aria-label="Minha localização">◎</button>
</header>

<div class="radar-dock" id="radarDock">
  <button class="radar-btn" id="captureLocation" type="button">
    <span class="radar-icon" aria-hidden="true"></span>
    Ligar radar de pontos
  </button>
</div>

<div class="spots-entry hidden" id="spotsEntry">
  <button class="spots-entry-btn" id="openPoints" type="button">
    <span class="entry-pulse"></span>
    <span id="openPointsLabel">Ver pontos próximos</span>
  </button>
</div>

<aside class="spots-card" id="spotsCard" aria-hidden="true">
  <div class="spots-bar"></div>

  <div class="spots-filters" id="filters">
    <button class="chip on" data-filter="todos" type="button">Todos</button>
    <button class="chip" data-filter="terra" type="button">Terra</button>
    <button class="chip" data-filter="barco" type="button">Barco</button>
    <button class="chip" data-filter="lagoa" type="button">Lagoa</button>
  </div>

  <div class="spots-body" id="spotsBody">
    <span class="spots-tag" id="cardRank">Melhor agora</span>
    <div class="spots-head">
      <h2 class="spots-name" id="cardName">—</h2>
      <span class="pill ir" id="cardVerdict">—</span>
    </div>
    <p class="spots-meta" id="cardMeta">—</p>
    <p class="spots-why" id="cardWhy"></p>
  </div>

  <button class="spots-go" id="cardGo" type="button">Ir agora</button>

  <nav class="spots-pager" id="pointsNav">
    <button class="pager-btn" id="pointPrev" type="button" aria-label="Anterior">‹</button>
    <span class="pager-count" id="pointCounter">—</span>
    <button class="pager-btn" id="pointNext" type="button" aria-label="Próximo">›</button>
  </nav>
</aside>

<div class="nav-strip" id="navStrip">
  <div><b id="navTitle">Navegando</b><small id="navMeta">—</small></div>
  <button class="nav-stop" id="stopNav" type="button">Parar</button>
</div>

<div class="radar-scan hidden" id="radarScan" aria-live="polite">
  <div class="radar-stage">
    <span class="radar-ring"></span>
    <span class="radar-ring"></span>
    <span class="radar-ring"></span>
    <span class="radar-sweep"></span>
    <span class="radar-core"></span>
  </div>
  <p class="radar-label" id="bootLoadingHint">Ligando radar…</p>
</div>

<section id="fallback" class="hidden">
  <div class="fallbox">
    <h2>Sem GPS</h2>
    <p>Escolha um bairro para ligar o radar.</p>
    <div class="places" id="places"></div>
    <button class="ghost" id="retryGps" type="button">Ligar radar de novo</button>
  </div>
</section>

<p class="weather-hint hidden" id="weatherNote">Condições estimadas — sem dados ao vivo.</p>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  const v = new URLSearchParams(location.search).get('v') || Date.now();
  import(`./js/app.js?v=${v}`);
</script>
</body>
</html>
