<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Meira Fishing</title>
<script src="js/boot-cache.js"></script>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="map-full">
<div id="map"></div>

<div class="topbar">
  <div class="status" id="statusLine">Achando você…</div>
  <button class="icon" id="relocate" type="button" aria-label="Minha localização">◎</button>
</div>

<section class="sheet collapsed" id="sheet" data-snap="hidden">
  <div class="sheet-drag"><div class="handle"></div></div>

  <div class="sheet-body">
    <div class="sheet-list" id="sheetList">
      <div class="sheet-head">
        <h1>Perto de você</h1>
        <p id="listSub">Carregando pontos…</p>
      </div>
      <div class="filters" id="filters">
        <button class="chip on" data-filter="todos">Todos</button>
        <button class="chip" data-filter="terra">Terra</button>
        <button class="chip" data-filter="barco">Barco</button>
        <button class="chip" data-filter="lagoa">Lagoa</button>
      </div>
      <div class="sheet-scroll" id="list"></div>
    </div>

    <div class="sheet-detail" id="sheetDetail">
      <button class="detail-back" id="closeDetail" type="button">← Voltar</button>
      <h2 class="detail-name" id="dName">Ponto</h2>
      <p class="detail-line" id="dLine">—</p>
      <p class="detail-why" id="dWhy"></p>
    </div>
  </div>

  <div class="sheet-footer" id="sheetFooter">
    <button class="go" id="goNow" type="button">Ir agora</button>
  </div>
</section>

<button class="open-points hidden" id="openPoints" type="button">Pontos próximos a você</button>

<div class="nav-strip" id="navStrip">
  <div><b id="navTitle">Navegando</b><small id="navMeta">—</small></div>
  <button class="nav-stop" id="stopNav" type="button">Parar</button>
</div>

<section id="boot">
  <div class="bootbox">
    <div class="pulse">M</div>
    <h2>Achando você</h2>
    <p>Autorize a localização para ver os pontos de pesca mais próximos.</p>
  </div>
</section>

<section id="fallback" class="hidden">
  <div class="fallbox">
    <h2>Sem GPS</h2>
    <p>Escolha um bairro para continuar.</p>
    <div class="places" id="places"></div>
    <button class="ghost" id="retryGps" type="button">Tentar GPS de novo</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  const v = new URLSearchParams(location.search).get('v') || Date.now();
  import(`./js/app.js?v=${v}`);
</script>
</body>
</html>
