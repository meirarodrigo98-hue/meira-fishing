<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Meira Fishing</title>
<script src="js/boot-cache.js"></script>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="status" id="statusLine">Achando você…</div>
  <button class="icon" id="relocate" type="button" aria-label="Minha localização">◎</button>
</div>

<section class="panel" id="sheet" data-snap="hidden">
  <div class="panel-head">
    <div>
      <p class="panel-title" id="listSub">Pontos perto de você</p>
      <p id="weatherNote" class="weather-note hidden">Condições estimadas</p>
    </div>
    <button class="panel-close" id="closePanel" type="button" aria-label="Fechar">✕</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip on" data-filter="todos">Todos</button>
    <button class="chip" data-filter="terra">Terra</button>
    <button class="chip" data-filter="barco">Barco</button>
    <button class="chip" data-filter="lagoa">Lagoa</button>
  </div>

  <div class="panel-card is-best" id="panelCard">
    <div class="card-top">
      <div>
        <span class="card-rank" id="cardRank">Melhor agora</span>
        <b class="card-name" id="cardName">—</b>
        <span class="card-meta" id="cardMeta">—</span>
      </div>
      <span class="verdict ir" id="cardVerdict">—</span>
    </div>
    <p class="card-why" id="cardWhy"></p>
    <button class="card-go" id="cardGo" type="button">Ir agora</button>
  </div>

  <div class="panel-nav" id="pointsNav">
    <button class="nav-btn" id="pointPrev" type="button">← Anterior</button>
    <span class="nav-count" id="pointCounter">—</span>
    <button class="nav-btn" id="pointNext" type="button">Próximo →</button>
  </div>
</section>

<button class="fab hidden" id="openPoints" type="button" aria-label="Ver pontos">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z"/>
    <circle cx="12" cy="11" r="2.5"/>
  </svg>
</button>

<div class="nav-strip" id="navStrip">
  <div><b id="navTitle">Navegando</b><small id="navMeta">—</small></div>
  <button class="nav-stop" id="stopNav" type="button">Parar</button>
</div>

<section id="boot">
  <div class="bootbox">
    <div class="pulse">M</div>
    <h2>Achando você</h2>
    <p>Autorize a localização para ver os pontos de pesca mais próximos.</p>
  </div>
</section>

<section id="fallback" class="hidden">
  <div class="fallbox">
    <h2>Sem GPS</h2>
    <p>Escolha um bairro para continuar.</p>
    <div class="places" id="places"></div>
    <button class="ghost" id="retryGps" type="button">Tentar GPS de novo</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  const v = new URLSearchParams(location.search).get('v') || Date.now();
  import(`./js/app.js?v=${v}`);
</script>
</body>
</html>
