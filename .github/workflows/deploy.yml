name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          V="${GITHUB_SHA:0:12}"
          mkdir -p _site/css _site/js/data _site/js/lib _site/js/features _site/assets
          cp index.html _site/index.html
          cp css/app.css _site/css/app.css
          cp -r assets/* _site/assets/ 2>/dev/null || true
          cp js/boot-cache.js _site/js/boot-cache.js
          cp js/app.js _site/js/app.js
          cp js/data/*.js _site/js/data/
          cp js/lib/*.js _site/js/lib/
          cp js/features/*.js _site/js/features/
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|export const SUPABASE_URL = ''|export const SUPABASE_URL = '${SUPABASE_URL}'|" _site/js/lib/supabase-client.js
            sed -i "s|export const SUPABASE_ANON_KEY = ''|export const SUPABASE_ANON_KEY = '${SUPABASE_ANON_KEY}'|" _site/js/lib/supabase-client.js
            sed -i 's|export const SUPABASE_ENABLED = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY)|export const SUPABASE_ENABLED = true|' _site/js/lib/supabase-client.js
          fi
          touch _site/.nojekyll
          printf '{"id":"%s","at":"%s"}\n' "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          chmod +x scripts/stamp-version.sh
          ./scripts/stamp-version.sh _site "$V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
